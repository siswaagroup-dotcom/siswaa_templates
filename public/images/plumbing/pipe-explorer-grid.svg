<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Residential pipe routing diagram</title>
  <desc id="desc">Original technical line drawing of supply, branch, and return pipes on a blueprint grid.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#54d1dc" stroke-opacity=".17" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="600" fill="#102d43"/><rect width="900" height="600" fill="url(#grid)"/>
  <path d="M100 480V120h280v120h170V95h230v410H100Z" fill="none" stroke="#b7d5d4" stroke-width="4"/>
  <path d="M100 320h680M380 120v360M550 240v265" fill="none" stroke="#7fa6b0" stroke-width="2" stroke-dasharray="8 7"/>
  <path d="M135 470V160h245v80h170V125h195v340H135Z" fill="none" stroke="#54d1dc" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#102d43" stroke="#e7f2eb" stroke-width="4"><circle cx="135" cy="470" r="15"/><circle cx="550" cy="240" r="15"/><circle cx="380" cy="365" r="15"/><circle cx="250" cy="320" r="15"/></g>
  <g fill="#54d1dc" font-family="monospace" font-size="16"><text x="72" y="530">SUPPLY</text><text x="585" y="225">KITCHEN</text><text x="170" y="350">BATH</text><text x="405" y="400">HEATER</text></g>
</svg>
